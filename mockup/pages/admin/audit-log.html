<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Audit Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #30302E;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }

    body {
      overflow: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #30302E;
      border: 1px solid #D97251;
      overflow: hidden;
    }

    .sidebar-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 260px;
      height: 100%;
      border: none;
      z-index: 50;
    }

    .section-container {
      position: absolute;
      left: 260px;
      top: 0;
      width: calc(100% - 260px);
      height: calc(100% - 4px);
      padding: 14px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .header-container {
      display: flex;
      align-items: flex-start;
      width: calc(100% - 10px);
      margin-left: 10px;
    }

    .heading-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 322px;
      min-height: 60px;
      height: auto;
    }

    .heading-title {
      margin: 8px 0 16px;
      font-size: 30px;
      line-height: 36px;
      font-weight: 700;
      letter-spacing: -0.75px;
      color: #fff;
    }

    .controls-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: calc(100% - 10px);
      min-height: 52px;
      margin-left: 10px;
      padding-top: 14px;
    }

    .search-wrapper {
      position: relative;
      width: 500px;
      height: 38px;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 8px 16px 8px 40px;
      background: #fff;
      border: 1px solid #E4DED5;
      border-radius: 12px;
      font-size: 14px;
      color: #2D2A27;
      outline: none;
    }

    .search-input::placeholder {
      color: #8A837A;
    }

    .search-input:focus,
    .dropdown-select:focus {
      border-color: #D97251;
      box-shadow: 0 0 0 1px #D97251;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 11px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 2;
    }

    .dropdown-container {
      position: relative;
      height: 38px;
      flex: 0 0 auto;
    }

    .dropdown-container.status { width: 145px; }
    .dropdown-container.department { width: 190px; }
    .dropdown-container.audit { width: 128px; }

    .dropdown-select {
      width: 100%;
      height: 38px;
      padding: 0 30px 0 14px;
      background: #fff;
      border: 1px solid #E4DED5;
      border-radius: 12px;
      color: #2D2A27;
      font-size: 12px;
      appearance: none;
      outline: none;
    }

    .dropdown-chevron {
      position: absolute;
      right: 11px;
      top: 12px;
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .add-button {
      height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #D97251;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      transition: background .15s ease, transform .15s ease;
    }

    .add-button:hover {
      background: #C45F3E;
      transform: translateY(-1px);
    }

    .table-margin-container {
      padding: 10px 0 0;
      width: calc(100% - 10px);
      margin-left: 10px;
      flex: 0 0 auto;
    }

    .table-container {
      width: 100%;
      background: #FFFDFA;
      border: 1px solid #EDE7DC;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      table-layout: fixed;
    }

    thead {
      background: #EDE3D0;
    }

    th {
      height: 44px;
      padding: 0 14px;
      color: #544D45;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    td {
      height: 49px;
      padding: 0 14px;
      color: #3A3632;
      font-size: 14px;
      font-weight: 500;
      border-top: 1px solid #F0EAE0;
      vertical-align: middle;
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      height: 23px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-approved {
      background: #F3EBD9;
      color: #715C32;
    }

    .badge-faculty {
      background: #E8F0FE;
      color: #1A73E8;
    }

    .badge-admin {
      background: #F3EBD9;
      color: #715C32;
    }

    .action-group {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .pill-btn {
      height: 30px;
      min-width: 72px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 12px;
      transition: transform .15s ease, background .15s ease;
    }

    .pill-btn:hover {
      transform: translateY(-1px);
    }

    .edit-btn {
      border: 1px solid #D8D0C4;
      background: #fff;
      color: #2D2A27;
    }

    .remove-btn {
      border: 0;
      background: #F05A5F;
      color: #fff;
    }

    .bottom-bar-container {
      width: calc(100% - 10px);
      margin-left: 10px;
      padding-top: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .pagination-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pagination {
      border: 1px solid #D8D0C4;
      background: #fff;
      color: #2D2A27;
    }

    .page-text {
      color: #D1CBC2;
      font-size: 11px;
      font-weight: 500;
    }

    .empty-state {
      display: none;
      width: 100%;
      height: 145px;
      align-items: center;
      justify-content: center;
      color: #716A60;
      font-size: 12px;
      background: #FFFDFA;
    }

    /* Modal interaction matches the recorded prototype:
       background dims, centered modal, then success toast after close. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(1px);
    }

    .modal-overlay.show {
      display: flex;
      animation: overlayIn .16s ease-out;
    }

    .modal-card {
      position: relative;
      width: min(390px, 100%);
      min-height: 425px;
      padding: 22px 48px 28px;
      background: #484B4A;
      border: 1px solid #D97251;
      border-radius: 12px;
      box-shadow: 0 22px 55px rgba(0,0,0,.4);
      animation: modalIn .18s ease-out;
    }

    .modal-card.compact {
      min-height: 258px;
      width: min(390px, 100%);
      padding: 20px 42px 24px;
    }

    .modal-card.faculty {
      min-height: 535px;
      width: min(440px, 100%);
    }

    .modal-title {
      color: #fff;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #1E1D1B;
      font-size: 26px;
      line-height: 26px;
    }

    .modal-form {
      min-height: 345px;
      display: flex;
      flex-direction: column;
    }

    .modal-card.compact .modal-form {
      min-height: 190px;
    }

    .modal-card.faculty .modal-form {
      min-height: 455px;
    }

    .modal-form label {
      margin: 48px 0 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    .modal-card.compact .modal-form label {
      margin-top: 16px;
    }

    .modal-card.faculty .modal-form label {
      margin: 14px 0 7px;
    }

    .modal-card.faculty .modal-form label:first-of-type {
      margin-top: 30px;
    }

    .modal-form input,
    .modal-form select,
    .modal-form textarea {
      width: 100%;
      border: 0;
      border-radius: 7px;
      background: #FFFDFA;
      color: #28261F;
      outline: none;
      font-size: 11px;
    }

    .modal-form input,
    .modal-form select {
      height: 36px;
      padding: 0 10px;
    }

    .modal-form textarea {
      min-height: 120px;
      padding: 10px;
      resize: none;
    }

    .modal-form input:focus,
    .modal-form select:focus,
    .modal-form textarea:focus {
      box-shadow: 0 0 0 2px #D97251;
    }

    .modal-submit {
      width: 100%;
      height: 38px;
      margin-top: auto;
      border: 0;
      border-radius: 7px;
      background: #30302E;
      color: #fff;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 120;
      display: none;
      min-width: 210px;
      padding: 13px 16px;
      border-radius: 10px;
      background: #D97251;
      color: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      font-size: 11px;
      font-weight: 600;
    }

    .toast.show {
      display: block;
      animation: toastIn .2s ease-out;
    }

    .masked-review {
      width: 128px;
      height: 12px;
      margin: 0 auto;
      border-radius: 2px;
      background: #625D55;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(8px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app-canvas {
        min-width: 880px;
        min-height: 640px;
        overflow: auto;
      }
    }
    button, input, select, textarea {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app-canvas">
    <iframe
      src="../../components/navigation/sidebar-admin.html"
      id="sidebar-frame"
      class="sidebar-frame"
      title="Admin Sidebar">
    </iframe>

    <main class="section-container">
      <div class="header-container">
        <div class="heading-wrapper">
          <h1 class="heading-title">Audit Log</h1>
        </div>
      </div>

      <div class="controls-container">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none">
  <circle cx="7" cy="7" r="4.5" stroke="#6C655D" stroke-width="1.3"/>
  <path d="M10.5 10.5L14 14" stroke="#6C655D" stroke-width="1.3" stroke-linecap="round"/>
</svg>
          <input id="searchInput" class="search-input" type="search" placeholder="Search audit logs...">
        </div>

        <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
          <div class="dropdown-container audit">
            <select id="userFilter" class="dropdown-select">
              <option value="all">User: All</option>
              <option value="Admin">Admin</option>
            </select>
            <svg class="dropdown-chevron" viewBox="0 0 14 14" fill="none">
  <path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="#6C655D" stroke-width="1.17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
          </div>

          <div class="dropdown-container audit">
            <select id="dateFilter" class="dropdown-select">
              <option value="all">Date: All</option>
              <option value="Sep 10">Sep 10</option>
              <option value="Sep 09">Sep 09</option>
              <option value="Sep 08">Sep 08</option>
            </select>
            <svg class="dropdown-chevron" viewBox="0 0 14 14" fill="none">
  <path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="#6C655D" stroke-width="1.17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
          </div>

          <div class="dropdown-container audit">
            <select id="actionFilter" class="dropdown-select">
              <option value="all">Action: All</option>
              <option value="Created">Created</option>
              <option value="Updated">Updated</option>
              <option value="Removed">Removed</option>
            </select>
            <svg class="dropdown-chevron" viewBox="0 0 14 14" fill="none">
  <path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="#6C655D" stroke-width="1.17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
          </div>
        </div>
      </div>

      <div class="table-margin-container">
        <div class="table-container">
          <div class="table-scroll">
            <table style="min-width: 840px;">
              <thead>
                <tr>
                  <th style="width: 21%;">Date &amp; Time</th>
                  <th class="text-center" style="width: 15%;">User</th>
                  <th class="text-center" style="width: 16%;">Action</th>
                  <th class="text-center" style="width: 18%;">Target</th>
                  <th class="text-center" style="width: 30%;">Review Content</th>
                </tr>
              </thead>
              <tbody id="tableBody">
            <tr data-search="sep 10, 10:42 am admin created faculty" data-user="Admin" data-date="Sep 10" data-action="Created">
              <td>Sep 10, 10:42 AM</td>
              <td class="text-center">Admin</td>
              <td class="text-center">Created</td>
              <td class="text-center"><span class="badge-pill badge-approved">Faculty</span></td>
              <td class="text-center"><div class="masked-review" title="Review content masked"></div></td>
            </tr>
            <tr data-search="sep 10, 09:18 am admin updated department" data-user="Admin" data-date="Sep 10" data-action="Updated">
              <td>Sep 10, 09:18 AM</td>
              <td class="text-center">Admin</td>
              <td class="text-center">Updated</td>
              <td class="text-center"><span class="badge-pill badge-approved">Department</span></td>
              <td class="text-center"><div class="masked-review" title="Review content masked"></div></td>
            </tr>
            <tr data-search="sep 09, 04:35 pm admin removed program" data-user="Admin" data-date="Sep 09" data-action="Removed">
              <td>Sep 09, 04:35 PM</td>
              <td class="text-center">Admin</td>
              <td class="text-center">Removed</td>
              <td class="text-center"><span class="badge-pill badge-approved">Program</span></td>
              <td class="text-center"><div class="masked-review" title="Review content masked"></div></td>
            </tr>
            <tr data-search="sep 09, 02:11 pm admin created faculty" data-user="Admin" data-date="Sep 09" data-action="Created">
              <td>Sep 09, 02:11 PM</td>
              <td class="text-center">Admin</td>
              <td class="text-center">Created</td>
              <td class="text-center"><span class="badge-pill badge-approved">Faculty</span></td>
              <td class="text-center"><div class="masked-review" title="Review content masked"></div></td>
            </tr>
            <tr data-search="sep 08, 11:26 am admin updated faculty" data-user="Admin" data-date="Sep 08" data-action="Updated">
              <td>Sep 08, 11:26 AM</td>
              <td class="text-center">Admin</td>
              <td class="text-center">Updated</td>
              <td class="text-center"><span class="badge-pill badge-approved">Faculty</span></td>
              <td class="text-center"><div class="masked-review" title="Review content masked"></div></td>
            </tr>
              </tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state">No audit log entries found.</div>
        </div>
      </div>

      <div class="bottom-bar-container">
        <div class="pagination-wrapper">
          <button class="pill-btn pagination" type="button">Previous</button>
          <span class="page-text">Page 1 of 3</span>
          <button class="pill-btn pagination" type="button">Next</button>
        </div>
      </div>
    </main>


    <script>
      function setSidebarActive(fileName) {
        const frame = document.getElementById('sidebar-frame');
        if (!frame) return;

        frame.addEventListener('load', () => {
          try {
            const doc = frame.contentDocument || frame.contentWindow.document;
            const links = doc.querySelectorAll('#sidebar-nav a');

            links.forEach(link => {
              link.classList.remove('nav-btn-active', 'font-bold', 'shadow-sm');
              link.classList.add('nav-btn-inactive', 'font-semibold');

              const svg = link.querySelector('svg');
              if (svg) svg.setAttribute('stroke', 'currentColor');

              if ((link.getAttribute('href') || '').endsWith(fileName)) {
                link.classList.remove('nav-btn-inactive', 'font-semibold');
                link.classList.add('nav-btn-active', 'font-bold', 'shadow-sm');
                if (svg) svg.setAttribute('stroke', '#A35233');
              }
            });
          } catch (_) {}
        });
      }

    <script>
      setSidebarActive('audit-log.html');

      const tableBody = document.getElementById('tableBody');
      const searchInput = document.getElementById('searchInput');
      const userFilter = document.getElementById('userFilter');
      const dateFilter = document.getElementById('dateFilter');
      const actionFilter = document.getElementById('actionFilter');
      const emptyState = document.getElementById('emptyState');

      function filterRows() {
        const query = searchInput.value.trim().toLowerCase();
        const user = userFilter.value;
        const date = dateFilter.value;
        const action = actionFilter.value;
        let visibleCount = 0;

        [...tableBody.rows].forEach(row => {
          const visible =
            row.dataset.search.includes(query) &&
            (user === 'all' || row.dataset.user === user) &&
            (date === 'all' || row.dataset.date === date) &&
            (action === 'all' || row.dataset.action === action);

          row.style.display = visible ? '' : 'none';
          if (visible) visibleCount++;
        });

        emptyState.style.display = visibleCount === 0 ? 'flex' : 'none';
      }

      searchInput.addEventListener('input', filterRows);
      userFilter.addEventListener('change', filterRows);
      dateFilter.addEventListener('change', filterRows);
      actionFilter.addEventListener('change', filterRows);
    </script>
  </div>
</body>
</html>
