<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <title>SPMIS - Pending Verification</title>
    <style>
        /* =========================================
           SPMIS GLOBAL MOCKUP CSS (Provided)
           ========================================= */

        /* --- 1. FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Outfit:wght@100..900&display=swap');

        /* Tokens inherited from global.css */

        /* --- 3. BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-color: var(--border);
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* --- 4. COMPONENTS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        /* =========================================
           PAGE-SPECIFIC STYLES (Pending Verification)
           ========================================= */

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .verification-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 550px;
            padding: 2rem;
        }

        /* Icon */
        .icon-clock {
            width: 72px;
            height: 72px;
            margin-bottom: 2rem;
        }

        /* Typography */
        .title {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .desc-main {
            font-size: 1rem;
            color: #e0e0e0;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .desc-sub {
            font-size: 0.8rem;
            color: #888888;
            margin-bottom: 2.5rem;
        }

        /* Button override */
        .btn-primary {
            background-color: var(--primary, #d97757);
            color: var(--primary-foreground, #ffffff);
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background-color: color-mix(in srgb, var(--primary, #d97757) 88%, #ffffff);
        }

        /* Footer pinned to bottom */
        .footer-links {
            position: absolute;
            bottom: 2.5rem;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }

        .footer-links a {
            color: #888;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #bbb;
        }
    </style>
</head>

<body>

    <div class="verification-wrapper">
        <!-- Inline SVG Clock Icon -->
        <svg class="icon-clock" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="#d97757" stroke-width="2.5" />
            <path d="M32 16 V32 L42 38" stroke="#d97757" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>

        <h1 class="title">Account Pending Verification</h1>

        <p class="desc-main">
            Your faculty account has been successfully submitted and is awaiting approval from the system administrator.
        </p>

        <p class="desc-sub">
            Check your email and verify your account by clicking the &ldquo;Verify Email&rdquo;.
        </p>

        <a href="signin.html" class="btn btn-primary">Back to Sign In</a>
    </div>

    <!-- Footer Pinned to Bottom -->
    <div class="footer-links">
        <a href="about.html">About</a> &bull;
        <a href="terms.html">Terms</a> &bull;
        <a href="privacy%20policy.html">Privacy Policy</a>
    </div>

</body>

</html>
