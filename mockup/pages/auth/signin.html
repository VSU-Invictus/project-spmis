<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMIS - Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Outfit:wght@100..900&display=swap');

        :root {
            --background: #262624;
            --card: #1e1e1d;
            --primary: #d97757;
            --text: #faf9f5;
            --muted: rgba(250, 249, 245, 0.7);
            --field: #333;
            --font-mono: 'Geist Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem 1.25rem 5.5rem;
            display: grid;
            place-items: center;
            background: var(--background);
            color: var(--text);
            font-family: var(--font-mono);
        }

        .login-wrapper {
            width: min(100%, 380px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-header { margin-bottom: 1.5rem; }
        .logo-icon { width: auto; height: 75px; object-fit: contain; }

        .login-card {
            width: 100%;
            min-height: 380px;
            padding: 2.5rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            border: 1px solid rgba(217, 119, 87, .4);
            border-radius: 12px;
            background: var(--card);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .2);
        }

        h1 { margin-bottom: 1.5rem; font-size: 1.35rem; line-height: 1.35; font-weight: 400; }
        .login-form { width: 100%; display: flex; flex-direction: column; gap: .85rem; }

        .input-field, .btn {
            width: 100%;
            height: auto;
            border: 0;
            border-radius: 6px;
            font: 400 .75rem/1 var(--font-mono);
        }

        .input-field {
            padding: .65rem 1rem;
            background: var(--field);
            color: var(--text);
        }
        .input-field::placeholder { color: var(--muted); }
        .input-field:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

        .btn { cursor: pointer; transition: filter .2s ease, transform .2s ease; }
        .btn:hover { filter: brightness(1.12); }
        .btn:active { transform: translateY(1px); }
        .btn-success { margin-top: .5rem; padding: .65rem; background: #1f5e27; color: #fff; }
        .btn-google { padding: .65rem; background: var(--field); color: #ccc; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-google svg { flex: 0 0 16px; width: 16px; height: 16px; }

        .forgot-password, .signup-prompt a { color: var(--primary); text-decoration: none; font-size: .65rem; }
        .forgot-password:hover, .signup-prompt a:hover { text-decoration: underline; }

        .forgot-password { margin-top: 1rem; }
        .divider { width: 100%; margin: 1.25rem 0; display: flex; align-items: center; gap: 10px; color: #888; font-size: .65rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #444; }
        .signup-prompt { margin-top: 1.5rem; color: #b0b0b0; font-size: .65rem; }

        .footer-links { position: fixed; bottom: 2.5rem; left: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0; color: #888; font-family: Outfit, sans-serif; font-size: .85rem; }
        .footer-links a { color: inherit; text-decoration: none; }
        .footer-links a:hover { color: var(--text); }
        .footer-links a + a::before { content: '•'; margin: 0 8px; color: #888; }

        .hidden { display: none !important; }
        .google-overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1.25rem; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
        .google-modal { position: relative; width: min(100%, 448px); padding: 36px 40px; border-radius: 8px; background: #fff; color: #202124; box-shadow: 0 4px 12px rgba(0,0,0,.15); font-family: Arial, sans-serif; text-align: center; }
        .google-close { position: absolute; top: 10px; right: 15px; border: 0; background: transparent; color: #5f6368; font-size: 24px; cursor: pointer; }
        .google-title { margin: 4px 0 10px; font-size: 24px; font-weight: 400; }
        .google-subtitle { margin-bottom: 28px; font-size: 16px; }
        .google-account-btn { width: 100%; display: flex; align-items: center; margin: 8px 0; padding: 12px 16px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; color: #202124; cursor: pointer; text-align: left; }
        .google-account-btn:hover { background: #f8f9fa; }
        .google-avatar { width: 32px; height: 32px; display: grid; place-items: center; margin-right: 12px; border-radius: 50%; background: #1a73e8; color: #fff; font-size: 14px; }
        .google-acc-info { display: flex; flex-direction: column; }
        .google-acc-name { color: #3c4043; font-size: 14px; font-weight: 500; }
        .google-acc-email { color: #5f6368; font-size: 12px; }
        .google-footer { margin-top: 28px; color: #5f6368; font-size: 12px; line-height: 1.5; text-align: left; }
        .google-footer a { color: #1a73e8; text-decoration: none; }

        @media (max-width: 500px) {
            body { padding-inline: 1rem; }
            .login-card { padding: 2rem 1.5rem; }
            .input-field, .btn { font-size: .75rem; }
            .footer-links { bottom: 1.25rem; gap: 10px; font-size: .85rem; }
            .footer-links a + a::before { margin-right: 10px; }
        }
    </style>
</head>
<body>
    <main class="login-wrapper">
        <div class="logo-header">
            <img src="../../assets/icons/SPMIS.png?v=1" alt="SPMIS logo" class="logo-icon" width="334" height="102" loading="eager">
        </div>

        <section class="login-card" aria-labelledby="signin-title">
            <h1 id="signin-title">Sign In</h1>
            <form id="signin-form" class="login-form">
                <input type="text" class="input-field" placeholder="Username" autocomplete="username" required>
                <input type="password" class="input-field" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="btn btn-success">Sign In</button>
            </form>
            <a class="forgot-password" href="#">Forgot Password?</a>
            <div class="divider"><span>or</span></div>
            <button type="button" id="trigger-google-btn" class="btn btn-google" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A7.1 7.1 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A10.98 10.98 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
            <p class="signup-prompt">New to SPMIS? <a href="signup.html">Create an Account</a></p>
        </section>
    </main>

    <footer class="footer-links">
        <a href="about.html">About</a><a href="terms.html">Terms</a><a href="privacy%20policy.html">Privacy Policy</a>
    </footer>

    <div id="google-overlay" class="google-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="google-title">
        <div class="google-modal">
            <button id="close-google" class="google-close" aria-label="Close">&times;</button>
            <h2 id="google-title" class="google-title">Sign in with Google</h2>
            <p class="google-subtitle">Choose an account to continue to <b>SPMIS</b></p>
            <button class="google-account-btn mock-login-action"><span class="google-avatar">F</span><span class="google-acc-info"><span class="google-acc-name">Faculty Member</span><span class="google-acc-email">faculty@university.edu</span></span></button>
            <button class="google-account-btn mock-login-action"><span class="google-avatar" style="background:#0f9d58">A</span><span class="google-acc-info"><span class="google-acc-name">Admin User</span><span class="google-acc-email">admin.spmis@university.edu</span></span></button>
            <p class="google-footer">To continue, Google will share your name, email address, and profile picture with SPMIS. Review SPMIS's <a href="privacy%20policy.html">privacy policy</a> and <a href="terms.html">terms of service</a>.</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('google-overlay');
        document.getElementById('trigger-google-btn').addEventListener('click', () => overlay.classList.remove('hidden'));
        document.getElementById('close-google').addEventListener('click', () => overlay.classList.add('hidden'));
        overlay.addEventListener('click', event => { if (event.target === overlay) overlay.classList.add('hidden'); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') overlay.classList.add('hidden'); });
        document.querySelectorAll('.mock-login-action').forEach(button => button.addEventListener('click', () => { window.location.href = '../faculty/dashboard.html'; }));
        document.getElementById('signin-form').addEventListener('submit', event => { event.preventDefault(); window.location.href = '../faculty/dashboard.html'; });
    </script>
</body>
</html>
