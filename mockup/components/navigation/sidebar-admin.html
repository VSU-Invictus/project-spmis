<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Sidebar Navigation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Navigate parent window when used in an iframe -->
    <base target="_parent">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #141413;
        }

        /* Active Navigation Item State - Exact Match to Design Spec */
        .nav-btn-active {
            background-color: #D97251 !important;
            color: #000000 !important;
            font-weight: 700 !important;
        }
    </style>
</head>

<body class="bg-[#141413] min-h-screen">

    <!-- ========================= STANDALONE NAVIGATION SIDEBAR ========================= -->
    <aside id="sidebar-menu"
        class="app-sidebar fixed top-0 left-0 bottom-0 w-[260px] h-screen bg-sidebar border-r border-sidebar-right select-none flex flex-col justify-between p-4 overflow-y-auto dark-scrollbar z-50">

        <div class="flex flex-col gap-1">
            <!-- Brand Title Header -->
            <div class="h-[48px] flex items-center px-2 pt-1 mb-2">
                <h1 class="font-extrabold text-[20px] leading-[26px] text-white tracking-tight">Admin Portal</h1>
            </div>

            <!-- Navigation Links Stream -->
            <nav class="nav flex flex-col gap-[3px]" id="sidebar-nav" aria-label="Admin navigation">

                <!-- 1. Dashboard -->
                <a href="../../pages/admin/dashboard.html" data-nav-key="dashboard" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.5" />
                        <rect x="11" y="2.5" width="6.5" height="6.5" rx="1.5" />
                        <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.5" />
                        <rect x="11" y="11" width="6.5" height="6.5" rx="1.5" />
                    </svg>
                    <span>Dashboard</span>
                </a>

                <!-- 2. Students -->
                <a href="../../pages/admin/students.html" data-nav-key="students" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Students</span>
                </a>

                <!-- 3. Departments -->
                <a href="../../pages/admin/departments.html" data-nav-key="departments" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="21" x2="21" y2="21"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <polygon points="12 2 3 10 21 10"></polygon>
                        <line x1="7" y1="21" x2="7" y2="10"></line>
                        <line x1="12" y1="21" x2="12" y2="10"></line>
                        <line x1="17" y1="21" x2="17" y2="10"></line>
                    </svg>
                    <span>Departments</span>
                </a>

                <!-- 4. Programs -->
                <a href="../../pages/admin/programs.html" data-nav-key="programs" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>Programs</span>
                </a>

                <!-- 5. Faculty -->
                <a href="../../pages/admin/faculty.html" data-nav-key="faculty" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Faculty</span>
                </a>

                <!-- 6. Audit Log -->
                <a href="../../pages/admin/audit-log.html" data-nav-key="audit-log" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Audit Log</span>
                </a>
            </nav>
        </div>

        <!-- User Profile Card & Footer Divider -->
        <div class="mt-auto pt-3 flex flex-col gap-3">
            <!-- Accent Line Divider -->
            <div class="sidebar-divider h-[1px] w-full border-b border-[#42423F]"></div>

            <!-- User Profile Box -->
            <div class="sidebar-account-card bg-account-card rounded-[18px] h-[58px] w-full px-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <!-- Avatar Badge -->
                    <div class="sidebar-avatar bg-avatar w-[34px] h-[34px] rounded-full flex items-center justify-center shrink-0">
                        <span class="text-avatar font-bold text-[17px] leading-none">A</span>
                    </div>

                    <!-- User Information Labels -->
                    <div class="sidebar-account-details flex flex-col">
                        <span class="sidebar-account-name text-white text-[13px] font-bold leading-tight">Admin User</span>
                        <span class="sidebar-account-role text-[#929292] text-[11px] font-medium leading-tight">System Admin</span>
                    </div>
                </div>

                <!-- Logout Button -->
                <button type="button" class="sidebar-logout-btn logout-btn" aria-label="Log out" title="Log out" onclick="handleLogout(event)">
                    <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                    </svg>
                </button>
            </div>
        </div>

    </aside>
    <!-- ========================= END REUSABLE SIDEBAR ========================= -->

    <script>
        // Dynamic navigation active state switcher
        function setActiveNav(element) {
            document.querySelectorAll('#sidebar-nav a').forEach(nav => {
                nav.classList.remove('nav-btn-active');
                nav.classList.add('nav-btn-inactive');
                nav.removeAttribute('aria-current');
            });

            element.classList.remove('nav-btn-inactive');
            element.classList.add('nav-btn-active');
            element.setAttribute('aria-current', 'page');
        }

        // Determine the current page from the iframe query string or parent window path so the correct sidebar item stays selected.
        const params = new URLSearchParams(window.location.search || '');
        let activeKey = (params.get('active') || '').toLowerCase();
        if (!activeKey) {
            try {
                const parentPath = (window.parent.location.pathname || '').toLowerCase();
                activeKey = parentPath.split('/').pop().replace('.html', '');
            } catch (e) {
                const myPath = (window.location.pathname || '').toLowerCase();
                activeKey = myPath.split('/').pop().replace('.html', '');
            }
        }
        if (!activeKey || activeKey === 'index') activeKey = 'dashboard';

        document.querySelectorAll('#sidebar-nav a').forEach(link => {
            const key = (link.dataset.navKey || '').toLowerCase();
            if (key === activeKey) {
                setActiveNav(link);
            }
        });

        // Custom Logout Dialog logic
        function handleLogout(event) {
            event.preventDefault();
            try {
                const parentDoc = window.parent.document;
                let dialog = parentDoc.getElementById('admin-logout-dialog');
                
                if (!dialog) {
                    dialog = parentDoc.createElement('dialog');
                    dialog.id = 'admin-logout-dialog';
                    dialog.style.cssText = 'width: min(420px, calc(100% - 32px)); margin: auto; padding: 26px; border: 1px solid #D97251; border-radius: 15px; background: #30302E; color: #FFF; font-family: "Inter", sans-serif;';
                    
                    let style = parentDoc.getElementById('admin-logout-style');
                    if (!style) {
                        style = parentDoc.createElement('style');
                        style.id = 'admin-logout-style';
                        style.textContent = 'dialog#admin-logout-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }';
                        parentDoc.head.appendChild(style);
                    }
                    
                    const form = parentDoc.createElement('form');
                    form.method = 'dialog';
                    
                    const h2 = parentDoc.createElement('h2');
                    h2.textContent = 'Log out?';
                    h2.style.cssText = 'margin: 0 0 8px; font-size: 20px; font-weight: bold;';
                    
                    const p = parentDoc.createElement('p');
                    p.textContent = 'Are you sure you want to end your admin session?';
                    p.style.cssText = 'margin: 0 0 22px; color: #9C948B; font-size: 14px; line-height: 1.5;';
                    
                    const actions = parentDoc.createElement('div');
                    actions.style.cssText = 'display: flex; justify-content: flex-end; gap: 12px;';
                    
                    const btnCancel = parentDoc.createElement('button');
                    btnCancel.type = 'submit';
                    btnCancel.value = 'cancel';
                    btnCancel.textContent = 'Cancel';
                    btnCancel.style.cssText = 'padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; background: transparent; color: #FFF; border: 1px solid #6C655D; transition: background 0.2s;';
                    btnCancel.onmouseover = () => btnCancel.style.background = 'rgba(255,255,255,0.1)';
                    btnCancel.onmouseout = () => btnCancel.style.background = 'transparent';
                    
                    const btnConfirm = parentDoc.createElement('button');
                    btnConfirm.type = 'submit';
                    btnConfirm.value = 'confirm';
                    btnConfirm.textContent = 'Log out';
                    btnConfirm.style.cssText = 'padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; background: #D97251; color: #FFF; border: none; transition: filter 0.2s;';
                    btnConfirm.onmouseover = () => btnConfirm.style.filter = 'brightness(1.1)';
                    btnConfirm.onmouseout = () => btnConfirm.style.filter = 'none';
                    
                    actions.appendChild(btnCancel);
                    actions.appendChild(btnConfirm);
                    
                    form.appendChild(h2);
                    form.appendChild(p);
                    form.appendChild(actions);
                    dialog.appendChild(form);
                    
                    dialog.addEventListener('close', () => {
                        if (dialog.returnValue === 'confirm') {
                            window.parent.location.href = '../../pages/auth/signin.html';
                        }
                    });
                    
                    parentDoc.body.appendChild(dialog);
                }
                
                dialog.showModal();
            } catch (e) {
                if (confirm('Are you sure you want to end your admin session?')) {
                    window.parent.location.href = '../../pages/auth/signin.html';
                }
            }
        }
    </script>
</body>

</html>
