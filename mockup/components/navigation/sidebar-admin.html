<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Sidebar Navigation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Navigate parent window when used in an iframe -->
    <base target="_parent">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #141413;
        }

        .bg-sidebar {
            background-color: #21201E;
        }

        .border-sidebar-right {
            border-color: #181716;
        }

        /* Active Navigation Item State */
        .nav-btn-active {
            background-color: #FAF8F5;
            color: #A35233;
        }

        /* Inactive Navigation Item State */
        .nav-btn-inactive {
            background-color: transparent;
            color: #98938D;
        }

        .nav-btn-inactive:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
        }

        /* Bottom Account Profile Card Styling */
        .bg-account-card {
            background-color: #2B2A27;
        }

        .bg-avatar {
            background-color: #F7E2D6;
        }

        .text-avatar {
            color: #A35233;
        }

        .border-divider {
            border-color: #8C4328;
        }

        /* Dark Theme Scrollbar for Sidebar Navigation */
        .dark-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .dark-scrollbar::-webkit-scrollbar-track {
            background: #21201E;
        }

        .dark-scrollbar::-webkit-scrollbar-thumb {
            background: #3E3D39;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-[#141413] min-h-screen">

            </div>

            <!-- Navigation Links Stream -->

                <!-- 1. Dashboard -->

                        stroke-width="2">

                        <rect x="11" y="2.5" width="6.5" height="6.5" rx="1.5" />
                        <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.5" />

                    </svg>

                </a>

                <!-- 2. Faculty Applications -->

                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="#A35233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>

                        <path d="M9 18h6"></path>
                        <path d="M9 10h.01"></path>
                    </svg>
                    <span>Faculty Applications</span>
                </a>

                <!-- 3. Student Applications -->
                <a href="../../pages/admin/student-applications.html" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
                        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>

                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>Program Applications</span>
                </a>

                <!-- 5. Department Application (Wrapped text matching reference) -->
                <a href="../../pages/admin/department-applications.html" onclick="setActiveNav(this)"
                    class="nav-btn-inactive py-2 px-3.5 rounded-2xl flex items-start gap-[12px] text-[13px] font-semibold transition-all leading-tight">
                    <svg class="w-[18px] h-[18px] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    <span>Department<br>Application</span>
                </a>

                <!-- 6. Students -->
                <a href="../../pages/admin/students.html" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>

                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>

                <!-- 7. Departments -->
                <a href="../../pages/admin/departments.html" onclick="setActiveNav(this)"

                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="21" x2="21" y2="21"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <polygon points="12 2 3 10 21 10"></polygon>
                        <line x1="7" y1="21" x2="7" y2="10"></line>
                        <line x1="12" y1="21" x2="12" y2="10"></line>

                <!-- 8. Programs -->
                <a href="../../pages/admin/programs.html" onclick="setActiveNav(this)"

                <!-- 9. Faculty -->
                <a href="../../pages/admin/faculty.html" onclick="setActiveNav(this)"

                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <!-- 10. Audit Log -->
                <a href="../../pages/admin/audit-log.html" onclick="setActiveNav(this)"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Audit Log</span>

            </nav>
        </div>

        <!-- User Profile Card & Footer Divider -->
        <div class="mt-auto pt-3 flex flex-col gap-3">
            <!-- Accent Line Divider -->
            <div class="h-[1px] w-full border-b border-divider opacity-80"></div>

            <!-- User Profile Box -->
            <div class="bg-account-card rounded-[18px] h-[58px] w-full px-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <!-- Avatar Badge -->
                    <div class="bg-avatar w-[34px] h-[34px] rounded-full flex items-center justify-center shrink-0">
                        <span class="text-avatar font-bold text-[17px] leading-none">A</span>
                    </div>

                    <!-- User Information Labels -->
                    <div class="flex flex-col">
                        <span class="text-white text-[13px] font-bold leading-tight">Admin User</span>
                        <span class="text-[#929292] text-[11px] font-medium leading-tight">System Admin</span>
                    </div>
                </div>

                <!-- Logout Button -->
                <button type="button" class="text-[#929292] hover:text-white transition-colors p-1.5 rounded-lg hover:bg-white/10" aria-label="Log out" title="Log out" onclick="handleLogout(event)">
                    <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                    </svg>
                </button>
            </div>
        </div>

    </aside>
    <!-- ========================= END REUSABLE SIDEBAR ========================= -->

    <script>
        // Dynamic navigation active state switcher
        function setActiveNav(element) {
            document.querySelectorAll('#sidebar-nav a').forEach(nav => {
                const isDept = (nav.getAttribute('href') || '').includes('department-application');
                nav.className = isDept
                    ? 'nav-btn-inactive py-2 px-3.5 rounded-2xl flex items-start gap-[12px] text-[13px] font-semibold transition-all leading-tight'
                    : 'nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all';
                const svg = nav.querySelector('svg');
                if (svg) svg.setAttribute('stroke', 'currentColor');
            });

            const isCurrentDept = (element.getAttribute('href') || '').includes('department-application');
            element.className = isCurrentDept
                ? 'nav-btn-active py-2 px-3.5 rounded-[16px] flex items-start gap-[12px] text-[13px] font-bold transition-all shadow-sm leading-tight'
                : 'nav-btn-active min-h-[42px] px-3.5 rounded-[16px] flex items-center gap-[12px] text-[13px] font-bold transition-all shadow-sm';
            const activeSvg = element.querySelector('svg');
            if (activeSvg) activeSvg.setAttribute('stroke', '#A35233');
        }

        // Auto-detect current active page from parent URL
        try {
            const currentPath = (window.parent.location.pathname || window.location.pathname).toLowerCase();
            document.querySelectorAll('#sidebar-nav a').forEach(link => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const pageName = href.substring(href.lastIndexOf('/') + 1);
                if (pageName && currentPath.endsWith(pageName)) {
                    setActiveNav(link);
                }
            });
        } catch (e) {
            // Fallback for security / cross-origin
        }

        // Custom Logout Dialog logic
        function handleLogout(event) {
            event.preventDefault();
            try {
                const parentDoc = window.parent.document;
                let dialog = parentDoc.getElementById('admin-logout-dialog');
                
                if (!dialog) {
                    dialog = parentDoc.createElement('dialog');
                    dialog.id = 'admin-logout-dialog';
                    dialog.style.cssText = 'width: min(420px, calc(100% - 32px)); margin: auto; padding: 26px; border: 1px solid #D97251; border-radius: 15px; background: #30302E; color: #FFF; font-family: "Inter", sans-serif;';
                    
                    let style = parentDoc.getElementById('admin-logout-style');
                    if (!style) {
                        style = parentDoc.createElement('style');
                        style.id = 'admin-logout-style';
                        style.textContent = 'dialog#admin-logout-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }';
                        parentDoc.head.appendChild(style);
                    }
                    
                    const form = parentDoc.createElement('form');
                    form.method = 'dialog';
                    
                    const h2 = parentDoc.createElement('h2');
                    h2.textContent = 'Log out?';
                    h2.style.cssText = 'margin: 0 0 8px; font-size: 20px; font-weight: bold;';
                    
                    const p = parentDoc.createElement('p');
                    p.textContent = 'Are you sure you want to end your admin session?';
                    p.style.cssText = 'margin: 0 0 22px; color: #9C948B; font-size: 14px; line-height: 1.5;';
                    
                    const actions = parentDoc.createElement('div');
                    actions.style.cssText = 'display: flex; justify-content: flex-end; gap: 12px;';
                    
                    const btnCancel = parentDoc.createElement('button');
                    btnCancel.type = 'submit';
                    btnCancel.value = 'cancel';
                    btnCancel.textContent = 'Cancel';
                    btnCancel.style.cssText = 'padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; background: transparent; color: #FFF; border: 1px solid #6C655D; transition: background 0.2s;';
                    btnCancel.onmouseover = () => btnCancel.style.background = 'rgba(255,255,255,0.1)';
                    btnCancel.onmouseout = () => btnCancel.style.background = 'transparent';
                    
                    const btnConfirm = parentDoc.createElement('button');
                    btnConfirm.type = 'submit';
                    btnConfirm.value = 'confirm';
                    btnConfirm.textContent = 'Log out';
                    btnConfirm.style.cssText = 'padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; background: #D97251; color: #FFF; border: none; transition: filter 0.2s;';
                    btnConfirm.onmouseover = () => btnConfirm.style.filter = 'brightness(1.1)';
                    btnConfirm.onmouseout = () => btnConfirm.style.filter = 'none';
                    
                    actions.appendChild(btnCancel);
                    actions.appendChild(btnConfirm);
                    
                    form.appendChild(h2);
                    form.appendChild(p);
                    form.appendChild(actions);
                    dialog.appendChild(form);
                    
                    dialog.addEventListener('close', () => {
                        if (dialog.returnValue === 'confirm') {
                            window.parent.location.href = '../../pages/auth/signin.html';
                        }
                    });
                    
                    parentDoc.body.appendChild(dialog);
                }
                
                dialog.showModal();
            } catch (e) {
                if (confirm('Are you sure you want to end your admin session?')) {
                    window.parent.location.href = '../../pages/auth/signin.html';
                }
            }
        }
    </script>
</body>

</html>
