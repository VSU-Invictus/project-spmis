<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Sidebar Navigation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Navigate parent window when used in an iframe -->
    <base target="_parent">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #141413;
        }

        .bg-sidebar {
            background-color: #21201E;
        }

        .border-sidebar-right {
            border-color: #181716;
        }

        /* Active Navigation Item State */
        .nav-btn-active {
            background-color: var(--primary, #D97251);
            color: var(--primary-foreground, #FFFFFF);
        }

        /* Inactive Navigation Item State */
        .nav-btn-inactive {
            background-color: transparent;
            color: #98938D;
        }

        .nav-btn-inactive:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
        }

        /* Bottom Account Profile Card Styling */
        .bg-account-card {
            background-color: #2B2A27;
        }

        .bg-avatar {
            background-color: #F7E2D6;
        }

        .text-avatar {
            color: #A35233;
        }

        .border-divider {
            border-color: #8C4328;
        }

        /* Dark Theme Scrollbar for Sidebar Navigation */
        .dark-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .dark-scrollbar::-webkit-scrollbar-track {
            background: #21201E;
        }

        .dark-scrollbar::-webkit-scrollbar-thumb {
            background: #3E3D39;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-[#141413] min-h-screen">

    <!-- ========================= STANDALONE FACULTY SIDEBAR ========================= -->
    <aside id="sidebar-menu"
        class="fixed top-0 left-0 bottom-0 w-[260px] h-screen bg-sidebar border-r border-sidebar-right select-none flex flex-col justify-between p-4 overflow-y-auto dark-scrollbar z-50">

        <div class="flex flex-col gap-1">
            <!-- Brand Title Header -->
            <div class="h-[48px] flex items-center px-2 pt-1 mb-2">
                <h1 class="font-extrabold text-[20px] leading-[26px] text-white tracking-tight">Faculty Portal</h1>
            </div>

            <!-- Navigation Links Stream -->
            <nav class="flex flex-col gap-[3px]" id="sidebar-nav">

                <!-- 1. Dashboard -->
                <a href="../../pages/faculty/dashboard.html"
                    class="nav-btn-active min-h-[42px] px-3.5 rounded-[16px] flex items-center gap-[12px] text-[13px] font-bold transition-all shadow-sm">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.5" />
                        <rect x="11" y="2.5" width="6.5" height="6.5" rx="1.5" />
                        <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.5" />
                        <rect x="11" y="11" width="6.5" height="6.5" rx="1.5" />
                    </svg>
                    <span>Dashboard</span>
                </a>

                <!-- 2. Students -->
                <a href="../../pages/faculty/students.html"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Students</span>
                </a>

                <!-- 3. Chats -->
                <a href="../../pages/faculty/chat.html"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-3 2V11.5a9.5 9.5 0 0 1 19 0Z"></path>
                        <path d="m12 6 1.3 3.7L17 11l-3.7 1.3L12 16l-1.3-3.7L7 11l3.7-1.3Z"></path>
                    </svg>
                    <span>Chats</span>
                </a>

                <!-- 4. Programs -->
                <a href="../../pages/faculty/programs.html"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>Programs</span>
                </a>

                <!-- 5. Departments -->
                <a href="../../pages/faculty/departments.html"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="21" x2="21" y2="21"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <polygon points="12 2 3 10 21 10"></polygon>
                        <line x1="7" y1="21" x2="7" y2="10"></line>
                        <line x1="12" y1="21" x2="12" y2="10"></line>
                        <line x1="17" y1="21" x2="17" y2="10"></line>
                    </svg>
                    <span>Departments</span>
                </a>

                <!-- 6. Applications -->
                <a href="../../pages/faculty/applications.html"
                    class="nav-btn-inactive min-h-[40px] px-3.5 rounded-2xl flex items-center gap-[12px] text-[13px] font-semibold transition-all">
                    <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <path d="M9 14h6"></path>
                        <path d="M9 18h6"></path>
                        <path d="M9 10h.01"></path>
                    </svg>
                    <span>Applications</span>
                </a>
            </nav>
        </div>

        <!-- User Profile Card & Footer Divider -->
        <div class="mt-auto pt-3 flex flex-col gap-3">
            <!-- Accent Line Divider -->
            <div class="h-[1px] w-full border-b border-divider opacity-80"></div>

            <!-- User Profile Box -->
            <div class="bg-account-card rounded-[18px] h-[58px] w-full px-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <!-- Avatar Badge -->
                    <div class="bg-avatar w-[34px] h-[34px] rounded-full flex items-center justify-center shrink-0">
                        <span class="text-avatar font-bold text-[17px] leading-none">A</span>
                    </div>

                    <!-- User Information Labels -->
                    <div class="flex flex-col">
                        <span class="text-white text-[13px] font-bold leading-tight" data-name>Alex Morgan</span>
                        <span class="text-[#929292] text-[11px] font-medium leading-tight">Faculty member</span>
                    </div>
                </div>

                <!-- Logout Button -->
                <a href="../../pages/auth/signin.html" class="text-[#929292] hover:text-white transition-colors p-1.5 rounded-lg hover:bg-white/10" aria-label="Log out" title="Log out">
                    <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                    </svg>
                </a>
            </div>
        </div>
    </aside>

</body>
</html>
