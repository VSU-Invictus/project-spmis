<div class="modal-overlay" id="approveModal" aria-hidden="true">
  <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="approveModalTitle">
    <button class="modal-close" id="closeApprove" type="button" aria-label="Close approval dialog">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M1 13L13 1M1 1L13 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h3 class="modal-title" id="approveModalTitle">Approve Applications</h3>
    <p class="modal-description">The selected applications will be moved to approved status.</p>
    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="cancelApprove">Cancel</button>
      <button type="button" class="modal-submit" id="confirmApprove">Confirm Approval</button>
    </div>
  </div>
</div>
