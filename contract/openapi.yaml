          minimum: 1
        created_at:
          type: string
          format: date-time
      example:
        id: e02d35de-a91f-4f53-aee3-406b38692af8
        review_id: 67015de8-1ce8-4ac4-8634-384bf5fb3821
        mime_type: application/pdf
        size_bytes: 245760
        created_at: '2026-10-26T00:00:00Z'
    TagSuggestion:
      type: object
      additionalProperties: false
      required:
        - tag
      properties:
        tag:
          $ref: '#/components/schemas/NormalizedTag'
      example:
        tag: research
    RichTextRun:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 10000
        bold:
          type: boolean
          default: false
        italic:
          type: boolean
          default: false
      description: >-
        Literal text rendered escaped; never interpret text as HTML. Embedded newline characters
        become line breaks.
    ParagraphBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - content
      properties:
        type:
          type: string
          const: paragraph
        content:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/RichTextRun'
    ListBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - items
      properties:
        type:
          type: string
          enum:
            - bullet_list
            - ordered_list
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: array
            minItems: 1
            maxItems: 200
            items:
              $ref: '#/components/schemas/RichTextRun'
    ReviewDocument:
      type: object
      additionalProperties: false
      required:
        - blocks
      properties:
        blocks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/ParagraphBlock'
              - $ref: '#/components/schemas/ListBlock'
      description: >-
        Proposed constrained rich-text representation: paragraphs, bold/italic text, lists and line
        breaks only. No links, media, raw HTML or embedded objects. Backend extracts body_text and
        separates adjacent blocks and list items with whitespace, trims body_text and counts
        nonempty whitespace-separated tokens, matching the mockup's 500-word limit. Empty content
        or more than 500 words returns 422; exactly 500 words is allowed. The additional
        10000-character cap is a proposed implementation limit for team review. Both aggregate
        limits are enforced server-side; OpenAPI alone cannot count words across rich-text nodes.
      x-max-words: 500
    ReviewStatusResult:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
