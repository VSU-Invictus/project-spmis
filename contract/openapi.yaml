openapi: 3.1.0
info:
  title: SPMIS API
  version: 0.1.0
  description: >-
    Contract-first API for the Student Profiling Management Information System. This curated
    contract documents only the operations available to the frontend. This is a review draft.
    Proposed backend views and functions are described before implementation; scope decisions are
    recorded in docs/contract-decisions.md. Data API calls require a public project apikey and the
    caller JWT. OAuth and refresh use Supabase Auth through its SDK. An RLS-filtered read or update
    may return an empty array; a filtered delete may affect zero rows. These outcomes must not be
    presented as proof that a record was changed.
  license:
    name: All Rights Reserved
    url: https://github.com/VSU-Invictus/project-spmis/blob/dev/README.md
servers:
  - url: https://{projectRef}.supabase.co
    description: Supabase project
    variables:
      projectRef:
        default: your-project-ref
security:
  - bearerAuth: []
    projectApiKey: []
tags:
  - name: Auth
    description: Session and faculty-profile operations.
  - name: Faculty
    description: Operations available to verified faculty members.
  - name: Admin
    description: Operations available to system administrators.
x-tagGroups:
  - name: Auth
    tags:
      - Auth
  - name: Faculty
    tags:
      - Faculty
  - name: Admin
    tags:
      - Admin
paths:
  /rest/v1/faculty_profiles:
    get:
      tags:
        - Auth
        - Admin
      operationId: listFaculty
      summary: List faculty profiles visible to the caller
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/IdFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
              - full_name.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Faculty profiles returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyProfile'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyProfile'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Users may retrieve their own profile, including while pending, using id=eq.<JWT subject>.
        Admins may list profiles. Other faculty cannot retrieve private profile emails. Native or
        search supports full_name and email. Contributor attribution is returned through
        review_details.
    post:
      tags:
        - Admin
      operationId: createFacultyProfile
      summary: Create a profile for an existing Supabase Auth user
      parameters:
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFacultyInput'
      responses:
        '201':
          description: Faculty profile created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Admin only. id must equal an existing auth.users.id. This operation neither creates OAuth
        identities nor provisions new Auth users. Backend creates an audit entry.
    patch:
      tags:
        - Admin
      operationId: updateFacultyByAdmin
      summary: Update a faculty profile allowed by the caller's role
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyUpdate'
      responses:
        '200':
          description: Faculty profile updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Admin only. Faculty use updateOwnProfile instead. RLS selects rows; database column grants
        or a guarded function/trigger must independently prevent non-admin changes to role, status,
        email and department. Every mutation is audited.
    delete:
      tags:
        - Admin
      operationId: deleteFacultyProfile
      summary: Remove an unreferenced faculty profile
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
      responses:
        '204':
          description: Faculty profile removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Admin only. Return 409 if reviews, revisions, applications or audit records reference the
        profile. Never cascade-delete authored content or audit history. This does not delete or
        disable the Auth identity.
  /rest/v1/rpc/suggest_review_tags:
    get:
      tags:
        - Faculty
      operationId: listTags
      summary: Suggest existing tags for the review composer
      description: >-
        Proposed read-only STABLE SQL function returning distinct normalized tag rows.
        Verified faculty only. prefix defaults to an empty string and matches the start of a
        tag case-insensitively. Join each tag to an active review the caller may access before
        deduplicating, counting or paginating. Hidden and deleted reviews never contribute,
        even for their owner. A tag also present on an accessible active review may still
        appear. Return only the tag text, without counts, author IDs or hidden-record metadata.
        RLS and the caller identity remain enforced. The result is a suggestion list, not a
        closed vocabulary: create/update may accept a new free-form tag. limit, offset and
        order are PostgREST result modifiers, not SQL function arguments.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
            maxLength: 50
            pattern: '^\S*$'
            default: ''
          example: re
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          schema:
            type: string
            enum: [tag.asc]
            default: tag.asc
      responses:
        '200':
          description: Distinct active-review tags; an empty match returns an empty array
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSuggestion'
              example:
                - tag: research
                - tag: resilience
        '206':
          description: Partial page when a count is requested
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /rest/v1/rpc/search_students:
    get:
      tags:
        - Faculty
      operationId: searchStudents
      summary: Search students through review-aware filters
      description: >-
        Verified faculty and admins may use structured mining. Proposed read-only STABLE, SECURITY
        INVOKER SQL function, with nullable filter arguments defaulting to null. query matches name,
        student number or active review body; optional filters are ANDed on the same active review.
        Hidden/deleted reviews never contribute, even for their owner. No review filter returns
        students without reviews too. limit/offset/order are PostgREST result modifiers, not
        function arguments.
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: owner_department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
              - last_name.asc,first_name.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Matching students returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSearchResult'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSearchResult'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /rest/v1/student_profiles:
    get:
      tags:
        - Faculty
        - Admin
      operationId: listStudentProfiles
      summary: List student profiles visible to the caller
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/IdFilter'
        - $ref: '#/components/parameters/ProgramFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
              - last_name.asc,first_name.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Student profiles returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProfile'
              example:
                - id: 45b54332-e470-4c21-a839-7428c4f6bf42
                  student_id_number: 27-1-12345
                  last_name: Santos
                  first_name: Maria
                  middle_name: null
                  program_id: 8ef76d5f-e6b2-49aa-a627-171dee1b8b65
                  registration_source: admin_direct
                  created_at: '2026-10-26T00:00:00Z'
                  updated_at: '2026-10-26T00:00:00Z'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProfile'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Verified faculty and admins. Filter id for a detail result; no matches returns []. Native or
        search supports first_name, last_name and student_id_number. Program display names are
        resolved using listPrograms.
    post:
      tags:
        - Admin
      operationId: createStudentDirect
      summary: Directly add a student
      description: >-
        Admin only. Create the student immediately with registration_source=admin_direct set by
        the backend, without an approval application. The referenced program must be approved.
        Create an audit event in the same database transaction. Faculty use submitApplication.
      parameters:
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Admin
      operationId: updateStudent
      summary: Update a student
      description: >-
        Admin only. Update the student selected by the required equality ID filter. Validate any
        changed program against approved programs and audit the mutation in the same transaction.
        Verified faculty may read students but cannot directly update them.
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Admin
      operationId: deleteStudent
      summary: Remove a student
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
      responses:
        '204':
          description: Student removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Admin only. Return 409 for referenced students; never cascade-delete review content.
  /rest/v1/departments:
    get:
      tags:
        - Faculty
        - Admin
      operationId: listDepartments
      summary: List departments
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/ManagedStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
              - name.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Departments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Verified faculty see approved entries; admins can filter all statuses. Draft onboarding
        proposal: pending applicants may read approved department choices only, with server-side
        policies enforcing status=approved regardless of client filters. They cannot read pending
        or rejected entries or mutate the list. This narrow exception to the README's pending-access
        rule requires team approval before implementation. Admin direct additions default to
        approved on the server and produce an audit event.
    post:
      tags:
        - Admin
      operationId: createDepartment
      summary: Directly add a department
      description: >-
        Admin only. Create an approved department with proposed_by=null set by the backend and
        audit the mutation in the same database transaction. Faculty propose changes through
        submitApplication rather than writing directly to this table.
      parameters:
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedListInput'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Admin
      operationId: updateDepartment
      summary: Update a department
      description: >-
        Admin only. Update the department selected by the required equality ID filter and audit
        the mutation in the same transaction. This edits the managed record; application decisions
        and their notifications must use decideApplications.
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedListInput'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Admin
      operationId: deleteDepartment
      summary: Remove a department
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
      responses:
        '204':
          description: Department removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Admin only. Return 409 when other records reference this item; do not cascade-delete
        dependent profiles or reviews.
  /rest/v1/programs:
    get:
      tags:
        - Faculty
        - Admin
      operationId: listPrograms
      summary: List programs
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/ManagedStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
              - name.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Programs returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Verified faculty see approved entries; admins can filter all statuses. Pending users have no
        directory access. Admin direct additions default to approved on the server and produce an
        audit event.
    post:
      tags:
        - Admin
      operationId: createProgram
      summary: Directly add a program
      description: >-
        Admin only. Create an approved program with proposed_by=null set by the backend and
        audit the mutation in the same database transaction. Programs are independent of
        departments. Faculty propose changes through submitApplication.
      parameters:
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedListInput'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Admin
      operationId: updateProgram
      summary: Update a program
      description: >-
        Admin only. Update the program selected by the required equality ID filter and audit
        the mutation in the same transaction. This edits the managed record; application decisions
        and their notifications must use decideApplications. Programs have no department relation.
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedListInput'
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Admin
      operationId: deleteProgram
      summary: Remove a program
      parameters:
        - $ref: '#/components/parameters/RequiredIdFilter'
      responses:
        '204':
          description: Program removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Admin only. Return 409 when other records reference this item; do not cascade-delete
        dependent profiles or reviews.
  /rest/v1/review_revisions:
    get:
      tags:
        - Faculty
      operationId: listReviewRevisions
      summary: List visible edit history for a review
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - name: review_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UuidEqualityFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - edited_at.desc,id.asc
              - edited_at.asc,id.asc
            default: edited_at.desc,id.asc
      responses:
        '200':
          description: Review revisions returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewRevision'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewRevision'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Verified faculty who can see the parent review may see its history. Hidden history is
        owner-only and deleted history is invisible to everyone. Snapshots preserve plain text,
        formatting, and tags from before each edit.
  /rest/v1/approval_queue_items:
    get:
      tags:
        - Auth
        - Faculty
        - Admin
      operationId: listApprovalQueueItems
      summary: List applications visible to the caller
      x-access-rules:
        pending_faculty: Own faculty_account applications only, including rejected history.
        active_faculty: Own applications only.
        admin: All application queues.
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - name: type
          in: query
          schema:
            type: string
            enum:
              - eq.faculty_account
              - eq.student_registration
              - eq.program_proposal
              - eq.department_proposal
        - name: status
          in: query
          schema:
            type: string
            enum:
              - eq.pending
              - eq.approved
              - eq.rejected
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Applications returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalQueueItem'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalQueueItem'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Active faculty see only their own applications; admins see all queues. Pending faculty
        may read only their own faculty_account applications, including the status, decision_reason
        and previous rejected submissions needed by the pending-verification screen. RLS must
        enforce both submitted_by=auth.uid() and type=faculty_account for pending callers,
        regardless of client filters. Requests for another person's rows or another application
        type return no matching rows. This onboarding exception grants no faculty feature access.
        Native or search
        supports payload->>name, payload->>first_name, payload->>last_name,
        payload->>student_id_number, payload->>email and payload->>full_name. Example:
        (payload->>name.ilike.*computer*,payload->>email.ilike.*gmail.com*). The backend enforces
        submitted_by, never a client filter alone.
    post:
      tags:
        - Faculty
      operationId: submitApplication
      summary: Submit a student, program, or department application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSubmission'
            examples:
              student:
                value:
                  type: student_registration
                  payload:
                    student_id_number: 27-1-12345
                    first_name: Maria
                    last_name: Santos
                    middle_name: null
                    program_id: 8ef76d5f-e6b2-49aa-a627-171dee1b8b65
              program:
                value:
                  type: program_proposal
                  payload:
                    name: BS Computer Science
              department:
                value:
                  type: department_proposal
                  payload:
                    name: Computer Science
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalQueueItem'
              example:
                - id: 32272463-1823-4774-a574-558101103e9a
                  type: student_registration
                  submitted_by: e48adc9e-1b79-4b92-9848-aa12b25d63d7
                  payload:
                    student_id_number: 27-1-12345
                    first_name: Maria
                    last_name: Santos
                    middle_name: null
                    program_id: 8ef76d5f-e6b2-49aa-a627-171dee1b8b65
                  status: pending
                  decided_by: null
                  decision_reason: null
                  created_at: '2026-10-26T00:00:00Z'
                  decided_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/PreferReturnRepresentation'
      description: >-
        Verified faculty only. Backend sets submitted_by=auth.uid(), status=pending, timestamps and
        null decision fields. Caller cannot set status or decision fields. Produce an audit event.
        Faculty-account enrollment uses completeFacultyRegistration instead.
  /rest/v1/audit_log_entries:
    get:
      tags:
        - Admin
      operationId: listAuditLogs
      summary: List masked audit metadata
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - $ref: '#/components/parameters/Search'
        - name: actor_role
          in: query
          schema:
            type: string
            enum:
              - eq.faculty
              - eq.admin
              - eq.system
        - name: action
          in: query
          schema:
            type: string
            pattern: ^eq\..+$
        - name: created_at
          in: query
          description: UTC timestamp bound, e.g. gte.2026-10-26T00:00:00Z. Use and for a bounded interval.
          schema:
            type: string
            pattern: ^(gte|gt|lte|lt)\..+$
        - name: and
          in: query
          description: >-
            Native AND date bounds, e.g.
            (created_at.gte.2026-10-26T00:00:00Z,created_at.lt.2026-10-27T00:00:00Z).
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Audit entries returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Admin only. Content-free, append-only events. Native or search supports action and
        entity_type. actor_role is the actor role captured when the event happened (a proposed
        schema addition). Never include review text, file names, object keys or secrets in metadata.
  /functions/v1/reviews:
    post:
      tags:
        - Faculty
      operationId: createReview
      summary: Create a student review
      description: >-
        Creates the review, produces its de-identified text, and generates its initial embedding in
        one backend operation. Verified faculty only; obtain owner_id from the JWT. The caller
        cannot create a review for another owner. Extract body_text from body_document; no
        formatting is sent to the AI provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ReviewValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /functions/v1/reviews/{id}:
    patch:
      tags:
        - Faculty
      operationId: updateReview
      summary: Update an owned review
      description: >-
        Saves a revision and regenerates de-identified text. The embedding is recomputed only while
        the review is active. Verified owner faculty only; deleted reviews cannot be edited (409).
        Capture old plain text, document and tags in the revision. Omitted tags preserve existing
        tags; [] clears them.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ReviewValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /functions/v1/reviews/{id}/status:
    post:
      tags:
        - Faculty
      operationId: setReviewStatus
      summary: Hide, unhide, or delete an owned review
      description: >-
        Verified owner faculty only. active + hide -> hidden; hidden + unhide -> active;
        active/hidden + delete -> deleted. Other transitions return 409. Remove embeddings on
        hide/delete and regenerate on unhide before committing. Deleted content is never returned,
        including to its former owner.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewStatusRequest'
      responses:
        '200':
          description: Status applied; no review content returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /functions/v1/chat:
    post:
      tags:
        - Faculty
        - Admin
      operationId: askChatbot
      summary: Ask the AI Chat Assistant across visible reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Assistant response returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Provider quota or faculty rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: The AI Chat Assistant is temporarily unavailable.
                details: null
                hint: Try again later.
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Verified faculty and admins may use this mining operation per README section 6. Stateless
        conversation: send prior history on follow-up questions. Backend de-identifies
        messages/history and retrieval context before sending any text to the provider, re-checks
        review visibility on every request, and never uses history to authorize hidden/deleted
        records. No system-role messages are accepted. Provider quota/faculty throttle returns 429;
        invalid input returns 422.
  /functions/v1/approvals:
    post:
      tags:
        - Admin
      operationId: decideApplications
      summary: Bulk approve or reject applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
      responses:
        '200':
          description: Application decisions completed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalQueueItem'
              examples:
                approved:
                  summary: Faculty enrollment approved and decision recorded
                  value:
                    - id: 07e42297-6b44-4b35-ab2f-d216d547bdc7
                      type: faculty_account
                      payload:
                        full_name: Alex Reyes
                        email: alex.reyes@example.edu
                        department_id: 5c52a935-befa-4e5f-8bc9-ef4ea9bf5ccb
                      status: approved
                      submitted_by: e48adc9e-1b79-4b92-9848-aa12b25d63d7
                      decided_by: 7cb8976d-86d4-4e06-a61d-5d64eb20eec4
                      decision_reason: null
                      created_at: '2026-10-26T00:00:00Z'
                      decided_at: '2026-10-27T00:00:00Z'
                rejected:
                  summary: Faculty enrollment rejected with an administrator's reason
                  value:
                    - id: 07e42297-6b44-4b35-ab2f-d216d547bdc7
                      type: faculty_account
                      payload:
                        full_name: Alex Reyes
                        email: alex.reyes@example.edu
                        department_id: 5c52a935-befa-4e5f-8bc9-ef4ea9bf5ccb
                      status: rejected
                      submitted_by: e48adc9e-1b79-4b92-9848-aa12b25d63d7
                      decided_by: 7cb8976d-86d4-4e06-a61d-5d64eb20eec4
                      decision_reason: Department affiliation could not be verified.
                      created_at: '2026-10-26T00:00:00Z'
                      decided_at: '2026-10-27T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Admin only. All IDs must be pending and accessible; decisions, audit entries and persistent
        submitter notifications commit in one database transaction. Missing/inaccessible item ->
        404; any decided item -> 409. Either failure changes no selected items. Reject requires a
        nonblank reason. Faculty-account approvals may redirect an inline department proposal via
        department_assignments. Batch limit 100 is proposed for review.
  /rest/v1/rpc/update_own_profile:
    post:
      tags:
        - Auth
      operationId: updateOwnProfile
      summary: Update the current verified faculty member name
      description: >-
        Verified faculty only. The SQL function obtains the identity from auth.uid(); no
        caller-supplied role, status, email or department is accepted. It applies only full_name,
        writes an audit event, and returns a setof FacultyProfile containing one row. RLS and
        database grants remain enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnProfileUpdate'
      responses:
        '200':
          description: Updated own profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyProfile'
                minItems: 1
                maxItems: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /rest/v1/review_details:
    get:
      tags:
        - Faculty
      operationId: listStudentReviews
      summary: List attributed reviews with rich text and normalized tags
      parameters:
        - $ref: '#/components/parameters/CountPreference'
        - name: student_id
          in: query
          schema:
            $ref: '#/components/schemas/UuidEqualityFilter'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - eq.active
              - eq.hidden
        - name: owner_id
          in: query
          schema:
            $ref: '#/components/schemas/UuidEqualityFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: order
          in: query
          description: Stable order including a unique id tie-breaker.
          schema:
            type: string
            enum:
              - created_at.desc,id.asc
              - created_at.asc,id.asc
            default: created_at.desc,id.asc
      responses:
        '200':
          description: Visible reviews returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '206':
          description: Partial result page when a count is requested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          headers:
            Content-Range:
              $ref: '#/components/headers/ContentRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: >-
        Proposed read-only SECURITY INVOKER view joining review rows, safe author identity and
        review tags. Author attribution must use a separately permissioned safe projection, not a
        direct join that depends on access to another user's private faculty profile. Expose only
        the author identity/name and department needed for attribution, never email or other
        private profile fields. The invoker must have the grants and row access needed for this
        projection without broadening private profile access. Backend design and tests must prove
        that another faculty member's active review retains its author attribution, own hidden
        reviews remain readable, and inaccessible review content and private emails remain blocked.
        Verified faculty see active plus their own hidden reviews; deleted reviews
        never appear. Dashboard sends status=eq.active and order=created_at.desc,id.asc. Excludes
        deidentified_text and embeddings. Admin raw-content access is unresolved in the README and
        is excluded pending review.
  /functions/v1/registration:
    post:
      tags:
        - Auth
      operationId: completeFacultyRegistration
      summary: Submit faculty enrollment or resubmit after rejection
      description: >-
        Proposed authenticated onboarding operation. Derive faculty_id and email from the verified
        Google/Supabase identity. A first submission creates or completes a pending profile and
        creates a faculty_account queue item. If a previous faculty_account submission was rejected
        and no pending submission exists, accept corrected input and create a NEW queue item with
        a NEW application_id while preserving the same faculty_id. Never reopen or overwrite the
        rejected queue item or its reason. An existing pending faculty_account application returns
        409 ENROLLMENT_PENDING. An already active faculty/admin profile returns 409 ALREADY_ACTIVE.
        Serialize concurrent submissions per authenticated identity and enforce at most one pending
        faculty_account application, so retrying or double-clicking cannot create duplicate entries.
        Create the pending application, any required inline department proposal, Terms acceptance
        and audit records atomically. Never promote a role or activate a profile through this path.
        Existing department UUIDs must refer to approved entries. Pending users may read their own
        profile, own faculty-account decisions/reasons and approved department reference choices.
        After rejection, use listApprovalQueueItems to display the reason and this operation to resubmit.
        Approved reference-list access remains a proposed onboarding exception for team review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyRegistrationRequest'
      responses:
        '201':
          description: Enrollment submitted for admin verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RegistrationConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    projectApiKey:
      type: apiKey
      in: header
      name: apikey
      description: Public Supabase project key; never use service-role or secret keys.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PreferReturnRepresentation:
      name: Prefer
      in: header
      required: true
      description: Requests that PostgREST return the affected record representation.
      schema:
        type: string
        const: return=representation
    IdFilter:
      name: id
      in: query
      required: false
      description: PostgREST filter, for example `eq.<uuid>`.
      schema:
        $ref: '#/components/schemas/UuidEqualityFilter'
    RequiredIdFilter:
      name: id
      in: query
      required: true
      description: Required PostgREST equality filter, formatted as `eq.<uuid>`.
      schema:
        $ref: '#/components/schemas/UuidEqualityFilter'
    Search:
      name: or
      in: query
      required: false
      description: >-
        Native PostgREST OR expression using only the columns documented for this operation. Escape
        reserved PostgREST syntax in user input. Example:
        (full_name.ilike.*alex*,email.ilike.*alex*).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ReviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NameFilter:
      name: name
      in: query
      description: Native case-insensitive substring filter, e.g. ilike.*computer*.
      schema:
        type: string
        pattern: ^ilike\..+$
    DepartmentFilter:
      name: department_id
      in: query
      schema:
        $ref: '#/components/schemas/UuidEqualityFilter'
    ProgramFilter:
      name: program_id
      in: query
      schema:
        $ref: '#/components/schemas/UuidEqualityFilter'
    ManagedStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
          - eq.pending
          - eq.approved
          - eq.rejected
    CountPreference:
      name: Prefer
      in: header
      schema:
        type: string
        const: count=exact
      description: Request the total count in Content-Range. Without this header the total may be *.
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PGRST301
            message: JWT is invalid or expired.
            details: null
            hint: null
    Forbidden:
      description: The caller is not allowed to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You are not allowed to perform this action.
            details: null
            hint: null
    NotFound:
      description: The requested record was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: The requested record was not found.
            details: null
            hint: Check the record identifier.
    RegistrationConflict:
      description: >-
        A pending enrollment already exists or the authenticated profile is already active.
        Rejected applications alone do not cause a conflict; they permit a new submission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            enrollmentPending:
              value:
                code: ENROLLMENT_PENDING
                message: Your faculty application is already awaiting a decision.
                details: No new application was created.
                hint: Check your current application status before submitting again.
            alreadyActive:
              value:
                code: ALREADY_ACTIVE
                message: Your account is already active.
                details: Active accounts cannot submit a faculty enrollment application.
                hint: Continue to your authorized portal.
    Conflict:
      description: The operation conflicts with the record's current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_STATE
            message: The operation is not allowed in the current state.
            details: null
            hint: Refresh the record and try an allowed action.
    ReviewValidationError:
      description: >-
        Review input is invalid. Reject empty extracted text, more than 500 words,
        unsupported formatting, invalid tags, or a proposed aggregate size-limit violation.
        Exactly 500 words is valid provided all other constraints are satisfied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            wordLimit:
              value:
                code: REVIEW_WORD_LIMIT
                message: Reviews must contain no more than 500 words.
                details: The extracted review contains 501 words; the limit is 500.
                hint: Shorten the review and submit it again.
            emptyReview:
              value:
                code: REVIEW_BODY_REQUIRED
                message: Enter a review before saving.
                details: The extracted review contains no non-whitespace text.
                hint: Add review text and submit it again.
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: The request contains invalid data.
            details: A required value is missing or malformed.
            hint: Correct the highlighted fields and retry.
    ServerError:
      description: An unexpected backend or provider failure occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: The request could not be completed.
            details: null
            hint: Try again later.
    BadRequest:
      description: Malformed JSON/filter, invalid input syntax, or native database validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 22P02
            message: Invalid input syntax for a column value.
            details: null
            hint: Correct the request.
    RangeNotSatisfiable:
      description: Requested pagination range is outside the result set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PGRST103
            message: Requested range not satisfiable
            details: An offset of 20 was requested, but there are only 10 rows.
            hint: null
